<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke Page - Game Boy Color Edition</title>
    <meta name="description"
        content="O Poke Page completo em uma página inteira temática do clássico Game Boy Color! Selecione gerações (Gen 1-9) e jogue os 5 modos.">
    <!-- Google Fonts: Press Start 2P, Pixelify Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&family=Outfit:wght@500;700;900&display=swap"
        rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            /* Game Boy Color Classic Theme Colors */
            --gb-body: #c4c5c7;
            --gb-body-dark: #b0b1b5;
            --gb-screen-bezel: #2d3142;
            --gb-screen-bg: #090d16;
            --gb-btn-red: #a81c51;
            --gb-btn-dark: #373b49;
            --gb-btn-grey: #6b7280;

            --accent-yellow: #facc15;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            /* Feedback Colors */
            --color-correct: #10b981;
            --color-partial: #f59e0b;
            --color-wrong: #ef4444;

            /* Type Colors */
            --type-normal: #A8A878;
            --type-fire: #F08030;
            --type-water: #6890F0;
            --type-grass: #78C850;
            --type-electric: #F8D030;
            --type-ice: #98D8D8;
            --type-fighting: #C03028;
            --type-poison: #A040A0;
            --type-ground: #E0C068;
            --type-flying: #A890F0;
            --type-psychic: #F85888;
            --type-bug: #A8B820;
            --type-rock: #B8A038;
            --type-ghost: #70559B;
            --type-dragon: #7038F8;
            --type-steel: #B8B8D0;
            --type-fairy: #EE99AC;
            --type-dark: #705848;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ZERO ROLAGEM NA PÁGINA (100vh EXACT FIT) */
        html,
        body {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #d8d9dd 0%, #c4c5c7 40%, #b0b1b5 100%);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
        }

        /* CONTAINER PRINCIPAL EDGE-TO-EDGE */
        .gameboy-console-fullscreen {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.85rem 1.25rem 0.5rem 1.25rem;
            box-shadow: inset 0 10px 30px rgba(255, 255, 255, 0.6), inset 0 -10px 30px rgba(0, 0, 0, 0.15);
        }

        /* MOLDURA DA TELA DO GAME BOY (BEZEL) */
        .screen-bezel {
            background: var(--gb-screen-bezel);
            border: 5px solid #1e222d;
            border-radius: 20px 20px 36px 20px;
            padding: 1rem 1.25rem;
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.4),
                inset 0 6px 14px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 1380px;
            margin: 0 auto;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* HEADER DO BEZEL: BATTERY + LOGO GAME BOY COLOR */
        .bezel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .battery-led-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .battery-led {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: pulseLed 2s infinite;
        }

        @keyframes pulseLed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .battery-text {
            font-size: 0.6rem;
            font-weight: 800;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }

        .gb-logo {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.95rem;
            font-style: italic;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .gb-color-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .gb-color-text span.c1 { color: #3b82f6; }
        .gb-color-text span.c2 { color: #ef4444; }
        .gb-color-text span.c3 { color: #eab308; }
        .gb-color-text span.c4 { color: #22c55e; }
        .gb-color-text span.c5 { color: #a855f7; }

        /* TELA LCD INTERNA COM ESTILO RETRO 16-BIT (DUAL-PANE) */
        .lcd-screen {
            background: var(--gb-screen-bg);
            border: 4px solid #000;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: visible;
            font-family: 'Pixelify Sans', 'Press Start 2P', monospace;
        }

        /* Efeito Scanlines Retrô */
        .lcd-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            border-radius: 8px;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.18) 50%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
        }

        /* MODOS DE JOGO NO TOPO DA TELA (ESTILO 16-BIT RETRO) */
        .mode-tabs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 0.85rem;
            flex-shrink: 0;
        }

        .mode-tab {
            background: #0f172a;
            border: 3px solid #334155;
            color: var(--text-muted);
            padding: 9px 4px;
            border-radius: 4px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.62rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
        }

        .mode-tab.active {
            background: #b91c1c;
            border-color: #ef4444;
            color: #fff;
            box-shadow: inset 2px 2px 0px #000, inset -2px -2px 0px rgba(255, 255, 255, 0.3), 0 0 12px rgba(239, 68, 68, 0.5);
            text-shadow: 1px 1px 0px #000;
        }

        .mode-tab:hover:not(.active) {
            border-color: #64748b;
            color: #fff;
            background: #1e293b;
        }

        /* PAINEL DUAL-GRID (2 COLUNAS LADO A LADO NA TELA) */
        .lcd-grid-content {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 1rem;
            flex: 1;
            min-height: 0;
        }

        /* COLUNA DA ESQUERDA: DISPLAY DO MODO + FILTRO DE GERAÇÕES */
        .lcd-pane-left {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            min-height: 0;
            overflow-y: auto;
        }

        /* COLUNA DA DIREITA: BUSCA + TABELA DE PALPITES / POKÉDEX */
        .lcd-pane-right {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* DISPLAY DO MODO 16-BIT */
        .mode-display-box {
            background: #090e1a;
            border: 3px solid #334155;
            border-radius: 6px;
            box-shadow: inset 3px 3px 0px #000, inset -3px -3px 0px rgba(255, 255, 255, 0.1);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            flex-shrink: 0;
            font-family: 'Pixelify Sans', 'Press Start 2P', monospace;
            font-size: 1.1rem;
        }

        .silhouette-img {
            width: 130px; height: 130px;
            object-fit: contain;
            filter: brightness(0) drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
            transition: filter 0.4s ease;
        }

        .silhouette-img.revealed {
            filter: brightness(1) drop-shadow(0 0 20px rgba(250, 204, 21, 0.6));
        }

        .dex-quote {
            font-size: 1.05rem;
            line-height: 1.45;
            color: #f1f5f9;
            text-align: center;
            font-family: 'Pixelify Sans', monospace;
        }

        .dex-censor {
            background: #ef4444;
            color: transparent;
            padding: 0 6px;
            border-radius: 2px;
        }

        .audio-btn-gb {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #facc15);
            border: 3px solid #000;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.4), 0 0 18px rgba(239, 68, 68, 0.5);
            transition: transform 0.2s;
        }

        .audio-btn-gb:hover { transform: scale(1.08); }

        /* PAINEL DE FILTRO DE GERAÇÕES 16-BIT */
        .gen-panel {
            background: #090e1a;
            border: 3px solid #334155;
            border-radius: 6px;
            padding: 0.85rem;
            box-shadow: inset 3px 3px 0px #000, inset -3px -3px 0px rgba(255, 255, 255, 0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.62rem;
            color: var(--accent-yellow);
            margin-bottom: 0.6rem;
        }

        .gen-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 0.6rem;
        }

        .gen-btn {
            background: #1e293b;
            border: 2px solid #475569;
            color: var(--text-muted);
            padding: 6px 4px;
            border-radius: 4px;
            font-family: 'Pixelify Sans', monospace;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px rgba(255, 255, 255, 0.15);
        }

        .gen-btn.active {
            background: #1d4ed8;
            border-color: #60a5fa;
            color: #fff;
            box-shadow: inset 2px 2px 0px #000, inset -2px -2px 0px rgba(255, 255, 255, 0.3), 0 0 10px rgba(56, 189, 248, 0.4);
            text-shadow: 1px 1px 0px #000;
        }

        .gen-btn:hover:not(.active) {
            border-color: #94a3b8;
            color: #fff;
        }

        .preset-btn {
            background: #1e293b;
            border: 2px solid #475569;
            color: #e2e8f0;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: 'Pixelify Sans', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px rgba(255, 255, 255, 0.15);
        }

        .preset-btn:hover {
            background: #2563eb;
            color: #fff;
            border-color: #93c5fd;
        }

        .btn-restart-retro {
            background: #991b1b;
            border: 2px solid #ef4444;
            color: #fff;
            font-family: 'Press Start 2P', monospace !important;
            font-size: 0.62rem;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px rgba(255, 255, 255, 0.3);
            transition: all 0.15s;
        }

        .btn-restart-retro:hover {
            background: #dc2626;
            border-color: #fca5a5;
        }

        /* CAMPO DE BUSCA 16-BIT RETRO (ONDE A PESSOA ESCREVE) */
        .search-container {
            position: relative;
            margin-bottom: 0.85rem;
            z-index: 500;
            flex-shrink: 0;
        }

        .search-box {
            width: 100%;
            background: #050911;
            border: 3px solid #38bdf8;
            border-radius: 6px;
            padding: 12px 16px;
            color: #fff;
            font-size: 1.25rem;
            font-family: 'Pixelify Sans', monospace !important;
            font-weight: 600;
            letter-spacing: 0.5px;
            outline: none;
            box-shadow: inset 3px 3px 0px #000, inset -2px -2px 0px rgba(255, 255, 255, 0.15), 0 0 12px rgba(56, 189, 248, 0.25);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box::placeholder {
            color: #64748b;
            font-family: 'Pixelify Sans', monospace !important;
        }

        .search-box:focus {
            border-color: var(--accent-yellow);
            box-shadow: inset 3px 3px 0px #000, 0 0 16px rgba(250, 204, 21, 0.4);
        }

        /* MENU AUTOCOMPLETE 16-BIT RETRO (ONDE A PESSOA SELECIONA AS COISAS) */
        .autocomplete-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: #080d1a;
            border: 3px solid var(--accent-blue);
            border-radius: 6px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 99999;
            box-shadow: inset 2px 2px 0px #000, 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 20px rgba(56, 189, 248, 0.4);
            display: none;
        }

        .autocomplete-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 2px solid #1e293b;
            transition: background 0.15s;
            font-family: 'Pixelify Sans', monospace !important;
        }

        .autocomplete-item:hover,
        .autocomplete-item.selected {
            background: #1e3a8a;
            color: #fff;
        }

        .autocomplete-item img { width: 38px; height: 38px; object-fit: contain; }
        .autocomplete-item .poke-name { font-size: 1.15rem; font-weight: 700; flex: 1; color: #fff; }
        .autocomplete-item .poke-id { font-size: 0.95rem; color: var(--accent-blue); font-weight: 700; }

        /* QUADRO DE PALPITES COM BLOCOS 16-BIT RETRO */
        #classicBoard {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .guesses-container {
            display: flex; flex-direction: column; gap: 8px;
            overflow-x: auto; overflow-y: auto; flex: 1; min-height: 0;
        }

        .guess-row-header {
            display: grid;
            grid-template-columns: 90px repeat(6, 1fr);
            gap: 8px;
            text-align: center;
            color: var(--accent-blue);
            text-transform: uppercase;
            min-width: 680px;
            padding: 0 4px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.58rem;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .guess-row {
            display: grid;
            grid-template-columns: 90px repeat(6, 1fr);
            gap: 8px;
            min-width: 680px;
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tile {
            height: 64px;
            border-radius: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 4px;
            text-align: center;
            font-size: 1rem; font-weight: 700; color: #fff;
            background: #1e293b;
            border: 3px solid #000;
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.35), inset -2px -2px 0px rgba(0, 0, 0, 0.5);
            font-family: 'Pixelify Sans', monospace !important;
        }

        .tile.correct { background: #059669 !important; border-color: #34d399; }
        .tile.partial { background: #d97706 !important; border-color: #fbbf24; }
        .tile.wrong { background: #dc2626 !important; border-color: #f87171; }

        .tile img { width: 42px; height: 42px; object-fit: contain; }
        .tile .arrow { font-size: 1.1rem; line-height: 1; margin-top: 2px; }

        .type-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'Pixelify Sans', monospace !important;
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.4), inset -1px -1px 0px rgba(0,0,0,0.4);
        }

        /* MODO ORDEM DA POKÉDEX 16-BIT */
        #orderBoard {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-bar-container {
            width: 100%; background: #060a12; border-radius: 4px; height: 24px;
            overflow: hidden; border: 3px solid #334155; position: relative; flex-shrink: 0;
            box-shadow: inset 2px 2px 0px #000;
        }

        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #2563eb, #16a34a);
            width: 0%; transition: width 0.4s ease;
        }

        .progress-text {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #fff; text-shadow: 1px 1px 2px #000;
            font-family: 'Press Start 2P', monospace; font-size: 0.58rem;
        }

        .hint-bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; flex-shrink: 0; }

        .hint-btn {
            background: #1e293b; border: 2px solid #475569; color: #fff;
            padding: 6px 12px; border-radius: 4px; font-size: 0.88rem; font-weight: 700;
            font-family: 'Pixelify Sans', monospace !important;
            cursor: pointer; transition: 0.15s;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px rgba(255, 255, 255, 0.15);
        }

        .hint-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); background: #0f172a; }

        .hint-box {
            background: rgba(56, 189, 248, 0.12); border: 3px solid var(--accent-blue);
            color: var(--accent-blue); padding: 8px 12px; border-radius: 6px;
            font-size: 0.98rem; font-weight: 700; text-align: center; display: none; flex-shrink: 0;
            font-family: 'Pixelify Sans', monospace !important;
            box-shadow: inset 2px 2px 0px #000;
        }

        .dex-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 8px; flex: 1; min-height: 0; overflow-y: auto; padding: 8px;
            border-radius: 6px; background: #060a12; border: 3px solid #1e293b;
            box-shadow: inset 3px 3px 0px #000;
        }

        .dex-slot {
            background: #1e293b; border: 2px solid #475569; border-radius: 4px;
            padding: 6px 4px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; cursor: pointer; transition: all 0.15s;
            position: relative; min-height: 100px;
            font-family: 'Pixelify Sans', monospace !important;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px rgba(255, 255, 255, 0.15);
        }

        .dex-slot:hover { border-color: var(--accent-blue); transform: translateY(-2px); }

        .dex-slot.active-focus {
            border-color: var(--accent-yellow); box-shadow: inset 2px 2px 0px #000, 0 0 14px rgba(250, 204, 21, 0.6);
            background: rgba(250, 204, 21, 0.16);
        }

        .dex-slot.unlocked { background: rgba(16, 185, 129, 0.15); border-color: #34d399; }
        .dex-slot .slot-num { font-size: 0.8rem; font-weight: 700; color: var(--accent-blue); position: absolute; top: 4px; left: 6px; }
        .dex-slot img { width: 44px; height: 44px; object-fit: contain; margin-top: 6px; }
        .dex-slot .slot-name { font-size: 0.88rem; font-weight: 700; margin-top: 2px; color: #fff; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dex-slot .slot-locked-icon { font-size: 1.4rem; opacity: 0.3; margin: 8px 0; }

        /* PAINEL UNIFICADO DE DICAS (MAX 2 DICAS DESBLOQUEADAS POR ERROS) */
        .hints-panel {
            background: #090e1a;
            border: 3px solid #334155;
            border-radius: 6px;
            padding: 0.75rem;
            box-shadow: inset 3px 3px 0px #000, inset -3px -3px 0px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .hints-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.62rem;
            color: var(--accent-yellow);
        }

        .error-badge {
            background: #dc2626;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.58rem;
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.4);
        }

        .hints-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .hint-card-btn {
            background: #1e293b;
            border: 2px solid #475569;
            color: #94a3b8;
            padding: 8px 6px;
            border-radius: 6px;
            font-family: 'Pixelify Sans', monospace !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px rgba(255, 255, 255, 0.15);
            user-select: none;
        }

        .hint-card-btn.locked {
            opacity: 0.7;
            cursor: not-allowed;

            function buildFullDex() {
                const fullList = [...POKEMON_DATABASE];
                const existingIds = new Set(fullList.map(p => p.id));

                GENERATIONS.forEach(g => {
                    for (let id = g.start; id <= g.end; id++) {
                        if (!existingIds.has(id)) {
                            fullList.push({
                                id: id,
                                name: `Pokémon #${id}`,
                                gen: g.gen,
                                type1: ['Normal', 'Fire', 'Water', 'Grass', 'Electric', 'Psychic', 'Fighting', 'Flying'][id % 8],
                                type2: id % 3 === 0 ? ['Poison', 'Steel', 'Fairy', 'Ground', 'Ghost'][id % 5] : 'None',
                                height: Math.round(((id % 25) * 0.1 + 0.3) * 10) / 10,
                                weight: Math.round(((id % 80) * 1.5 + 2.0) * 10) / 10,
                                stage: id % 4 === 0 ? '3º Estágio' : (id % 2 === 0 ? '2º Estágio' : '1º Estágio'),
                                desc: `Um incrível Pokémon descoberto na região da ${g.name}.`
                            });
                        }
                    }
                });
                return fullList.sort((a, b) => a.id - b.id);
            }

            const ALL_POKEMON = buildFullDex();

            async function fetchOfficialPokemonNames() {
                try {
                    const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
                    if (!response.ok) return;
                    const data = await response.json();

                    data.results.forEach((item, idx) => {
                        const id = idx + 1;
                        const target = ALL_POKEMON.find(p => p.id === id);
                        if (target && target.name.startsWith('Pokémon #')) {
                            let formattedName = item.name.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join('-');
                            if (formattedName.toLowerCase() === 'nidoran-f') formattedName = 'Nidoran♀';
                            if (formattedName.toLowerCase() === 'nidoran-m') formattedName = 'Nidoran♂';
                            if (formattedName.toLowerCase() === 'mr-mime') formattedName = "Mr. Mime";
                            target.name = formattedName;
                        }
                    });

                    if (typeof updatePool === 'function') updatePool();
                    if (typeof renderOrderDexBoard === 'function' && activeMode === 'order') renderOrderDexBoard();
                } catch (err) {
                    console.log('Modo offline / API indisponível.');
                }
            }

            fetchOfficialPokemonNames();

            /* =========================================================
               ESTADO DA APLICAÇÃO (PRIVADO / PROTEGIDO EM FECHAMENTO)
               ========================================================= */
            let selectedGens = new Set([1, 2, 3, 4, 5, 6, 7, 8, 9]);
            let activeMode = 'classic';

            // CADA MODO POSSUI SEU PRÓPRIO POKÉMON ALVO, PALPITES E ERROS INDEPENDENTES!
            let modeTargets = {
                classic: null,
                silhouette: null,
                pokedex: null,
                sound: null
            };

            let modeGuesses = {
                classic: [],
                silhouette: [],
                pokedex: [],
                sound: []
            };

            let modeErrors = {
                classic: 0,
                silhouette: 0,
                pokedex: 0,
                sound: 0
            };

            let currentPool = [];
            let unlockedDexIds = new Set(JSON.parse(localStorage.getItem('pokedle_unlocked_dex') || '[]'));
            let activeDexSlotId = null;
            let slotErrors = {};
            let activeHintRevealed = null;

            let stats = {
                wins: parseInt(localStorage.getItem('pokedle_wins') || '0'),
                streak: parseInt(localStorage.getItem('pokedle_streak') || '0'),
                attempts: 0
            };

            document.addEventListener('DOMContentLoaded', () => {
                renderGenButtons();
                updatePool();
                resetGame();

                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', handleSearchInput);
                searchInput.addEventListener('keydown', handleSearchKeydown);

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.search-container')) {
                        document.getElementById('autocompleteList').style.display = 'none';
                    }
                });
            });

            function renderGenButtons() {
                const grid = document.getElementById('genGrid');
                grid.innerHTML = GENERATIONS.map(g => `
            <button class="gen-btn ${selectedGens.has(g.gen) ? 'active' : ''}" onclick="toggleGen(${g.gen})">
              <span style="font-size: 0.82rem;">Gen ${g.gen}</span>
              <span style="font-size: 0.62rem; opacity: 0.7;">#${g.start}-${g.end}</span>
            </button>
          `).join('');
            }

            function toggleGen(gen) {
                if (selectedGens.has(gen)) {
                    if (selectedGens.size > 1) selectedGens.delete(gen);
                } else {
                    selectedGens.add(gen);
                }
                renderGenButtons();
                updatePool();
                resetGame();
            }

            function selectGens(preset) {
                selectedGens.clear();
                if (preset.includes('all')) {
                    GENERATIONS.forEach(g => selectedGens.add(g.gen));
                } else {
                    preset.forEach(gen => selectedGens.add(gen));
                }
                renderGenButtons();
                updatePool();
                resetGame();
            }

            function updatePool() {
                currentPool = ALL_POKEMON.filter(p => selectedGens.has(p.gen));
                document.getElementById('poolCounter').innerText = `${currentPool.length} POKÉMON`;

                if (currentPool.length > 0) {
                    const firstEmpty = currentPool.find(p => !unlockedDexIds.has(p.id));
                    activeDexSlotId = firstEmpty ? firstEmpty.id : currentPool[0].id;
                }
            }

            function resetGame(modeToReset) {
                if (currentPool.length === 0) return;

                const modes = ['classic', 'silhouette', 'pokedex', 'sound'];

                if (modeToReset && modes.includes(modeToReset)) {
                    modeTargets[modeToReset] = currentPool[Math.floor(Math.random() * currentPool.length)];
                    modeGuesses[modeToReset] = [];
                    modeErrors[modeToReset] = 0;
                } else {
                    modes.forEach(m => {
                        modeTargets[m] = currentPool[Math.floor(Math.random() * currentPool.length)];
                        modeGuesses[m] = [];
                        modeErrors[m] = 0;
                    });
                }

                stats.attempts = 0;
                activeHintRevealed = null;

                document.getElementById('searchInput').value = '';
                document.getElementById('autocompleteList').style.display = 'none';

                renderAllGuessesForActiveMode();
                updateHintsUI();
                renderModeDisplay();
                if (activeMode === 'order') {
                    renderOrderDexBoard();
                }
            }

            function renderAllGuessesForActiveMode() {
                const container = document.getElementById('guessesContainer');
                container.innerHTML = '';

                if (activeMode === 'order') return;

                const currentGuesses = getActiveGuesses();
                const target = getActiveTarget();
                if (!target) return;

                currentGuesses.slice().reverse().forEach(guess => {
                    renderClassicRow(guess, target);
                });
            }

            function switchMode(mode) {
                activeMode = mode;
                activeHintRevealed = null;

                document.querySelectorAll('.mode-tab').forEach(t => {
                    t.classList.toggle('active', t.dataset.mode === mode);
                });

                const classicBoard = document.getElementById('classicBoard');
                const orderBoard = document.getElementById('orderBoard');

                classicBoard.style.display = mode === 'classic' ? 'flex' : 'none';
                orderBoard.style.display = mode === 'order' ? 'flex' : 'none';

                renderAllGuessesForActiveMode();
                updateHintsUI();
                renderModeDisplay();

                if (mode === 'order') {
                    renderOrderDexBoard();
                }
            }

            function drawSilhouetteCanvas(id, isRevealed) {
                const canvas = document.getElementById('silhouetteCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    if (!isRevealed) {
                        ctx.globalCompositeOperation = 'source-in';
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.globalCompositeOperation = 'source-over';
                    }
                };
            }

            function renderModeDisplay() {
                const box = document.getElementById('modeDisplayBox');
                box.innerHTML = '';

                const target = getActiveTarget();
                if (!target) return;

                const currentGuesses = getActiveGuesses();

                if (activeMode === 'classic') {
                    box.innerHTML = `
              <div style="color: var(--text-muted); font-size: 0.88rem; text-align: center;">
                Adivinhe o Pokémon pelas suas características! Blocos coloridos e setas indicarão as dicas.
              </div>
            `;
                } else if (activeMode === 'order') {
                    const activePoke = ALL_POKEMON.find(p => p.id === activeDexSlotId) || currentPool[0];
                    box.innerHTML = `
              <div style="font-weight: 800; font-size: 1.05rem; color: var(--accent-yellow); margin-bottom: 4px; text-align: center;">
                🎯 Preenchendo Pokémon #${String(activePoke.id).padStart(3, '0')}
              </div>
              <div style="color: var(--text-muted); font-size: 0.82rem; text-align: center;">
                Digite o nome do Pokémon do slot destacado!
              </div>
            `;
                } else if (activeMode === 'silhouette') {
                    const isRevealed = currentGuesses.some(g => g.id === target.id);
                    box.innerHTML = `
              <canvas id="silhouetteCanvas" width="130" height="130" class="silhouette-img ${isRevealed ? 'revealed' : ''}"></canvas>
              <div style="margin-top: 8px; font-size: 0.82rem; color: var(--text-muted); text-align: center;">
                ${isRevealed ? '✨ Pokémon Revelado!' : 'Quem é esse Pokémon?'}
              </div>
            `;
                    setTimeout(() => drawSilhouetteCanvas(target.id, isRevealed), 10);
                } else if (activeMode === 'pokedex') {
                    const isRevealed = currentGuesses.some(g => g.id === target.id);
                    const text = target.desc || 'Um Pokémon misterioso descoberto na região.';
                    const regex = new RegExp(target.name, 'gi');
                    const censoredText = isRevealed
                        ? text
                        : text.replace(regex, `<span class="dex-censor">█████</span>`);

                    box.innerHTML = `
              <div class="dex-quote">
                "${censoredText}"
              </div>
              <div style="margin-top: 8px; font-size: 0.8rem; color: var(--accent-blue); text-align: center;">
                📖 Pokédex Entry (Gen ${target.gen})
              </div>
            `;
                } else if (activeMode === 'sound') {
                    box.innerHTML = `
              <button class="audio-btn-gb" onclick="playCry()">🔊</button>
              <div style="margin-top: 10px; font-size: 0.82rem; color: var(--text-muted); text-align: center;">
                Clique no botão para escutar o grito do Pokémon!
              </div>
            `;
                    playCry();
                }
            }

            function playCry() {
                const target = getActiveTarget();
                if (!target) return;
                const audioUrl = `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${target.id}.ogg`;
                const audio = new Audio(audioUrl);
                audio.play().catch(() => {
                    const legacyAudio = new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/legacy/${target.id}.ogg`);
                    legacyAudio.play().catch(() => console.log('Áudio indisponível'));
                });
            }

            function renderOrderDexBoard() {
                const grid = document.getElementById('dexGrid');
                grid.innerHTML = '';

                let unlockedCount = 0;
                currentPool.forEach(p => {
                    const isUnlocked = unlockedDexIds.has(p.id);
                    if (isUnlocked) unlockedCount++;

                    const isFocus = p.id === activeDexSlotId;

                    const slotEl = document.createElement('div');
                    slotEl.className = `dex-slot ${isUnlocked ? 'unlocked' : ''} ${isFocus ? 'active-focus' : ''}`;
                    slotEl.onclick = () => selectDexSlot(p.id);

                    if (isUnlocked) {
                        slotEl.innerHTML = `
                <span class="slot-num">#${String(p.id).padStart(3, '0')}</span>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="${p.name}" />
                <span class="slot-name">${p.name}</span>
              `;
                    } else {
                        slotEl.innerHTML = `
                <span class="slot-num">#${String(p.id).padStart(3, '0')}</span>
                <div class="slot-locked-icon">❓</div>
                <span class="slot-name" style="opacity: 0.4;">???</span>
              `;
                    }

                    grid.appendChild(slotEl);
                });

                const total = currentPool.length;
                const pct = total > 0 ? Math.round((unlockedCount / total) * 100) : 0;
                document.getElementById('orderProgressBar').style.width = `${pct}%`;
                document.getElementById('orderProgressText').innerText = `${unlockedCount} / ${total} POKÉMON (${pct}%)`;
            }

            function selectDexSlot(id) {
                activeDexSlotId = id;
                activeHintRevealed = null;
                updateHintsUI();
                renderOrderDexBoard();
                renderModeDisplay();
            }

            function getActiveTarget() {
                if (activeMode === 'order') {
                    return ALL_POKEMON.find(p => p.id === activeDexSlotId) || currentPool[0];
                }
                return modeTargets[activeMode];
            }

            function getActiveErrors() {
                if (activeMode === 'order') {
                    return slotErrors[activeDexSlotId] || 0;
                }
                return modeErrors[activeMode] || 0;
            }

            function getActiveGuesses() {
                if (activeMode === 'order') return [];
                return modeGuesses[activeMode] || [];
            }

            function updateHintsUI() {
                const errors = getActiveErrors();
                const target = getActiveTarget();

                const badge = document.getElementById('errorCounterBadge');
                if (badge) {
                    badge.innerText = `${errors} ${errors === 1 ? 'Erro' : 'Erros'}`;
                }

                const btn1 = document.getElementById('btnHint1');
                const btn2 = document.getElementById('btnHint2');
                const hintBox = document.getElementById('universalHintBox');

                if (!btn1 || !btn2 || !target) return;

                const hint1Unlocked = errors >= 3;
                if (hint1Unlocked) {
                    btn1.classList.remove('locked');
                    btn1.classList.add('unlocked');
                    btn1.innerHTML = `
                        <span class="hint-icon">💡</span>
                        <span class="hint-label">Dica 1</span>
                        <span class="hint-req">Desbloqueada!</span>
                    `;
                } else {
                    btn1.classList.remove('unlocked');
                    btn1.classList.add('locked');
                    btn1.innerHTML = `
                        <span class="hint-icon">🔒</span>
                        <span class="hint-label">Dica 1</span>
                        <span class="hint-req">(3 erros para liberar)</span>
                    `;
                }

                const hint2Unlocked = errors >= 6;
                if (hint2Unlocked) {
                    btn2.classList.remove('locked');
                    btn2.classList.add('unlocked');
                    btn2.innerHTML = `
                        <span class="hint-icon">💡</span>
                        <span class="hint-label">Dica 2</span>
                        <span class="hint-req">Desbloqueada!</span>
                    `;
                } else {
                    btn2.classList.remove('unlocked');
                    btn2.classList.add('locked');
                    btn2.innerHTML = `
                        <span class="hint-icon">🔒</span>
                        <span class="hint-label">Dica 2</span>
                        <span class="hint-req">(6 erros para liberar)</span>
                    `;
                }

                if (activeHintRevealed === 1 && hint1Unlocked) {
                    renderHintContent(1);
                } else if (activeHintRevealed === 2 && hint2Unlocked) {
                    renderHintContent(2);
                } else {
                    activeHintRevealed = null;
                    if (hintBox) hintBox.style.display = 'none';
                }
            }

            function triggerHint(num) {
                const errors = getActiveErrors();
                const reqErrors = num === 1 ? 3 : 6;

                if (errors < reqErrors) {
                    const btn = document.getElementById(`btnHint${num}`);
                    if (btn) {
                        btn.classList.add('shake');
                        setTimeout(() => btn.classList.remove('shake'), 400);
                    }
                    showToastNotification(`🔒 A Dica ${num} precisa de ${reqErrors} erros! (Você tem ${errors})`);
                    return;
                }

                const hintBox = document.getElementById('universalHintBox');
                if (activeHintRevealed === num) {
                    activeHintRevealed = null;
                    if (hintBox) hintBox.style.display = 'none';
                } else {
                    activeHintRevealed = num;
                    renderHintContent(num);
                }
            }

            function renderHintContent(num) {
                const target = getActiveTarget();
                const hintBox = document.getElementById('universalHintBox');
                if (!target || !hintBox) return;

                hintBox.style.display = 'block';

                const t1 = TYPE_TRANSLATIONS[target.type1] || target.type1;
                const t2 = target.type2 && target.type2 !== 'None' ? `/ ${TYPE_TRANSLATIONS[target.type2] || target.type2}` : '';
                const typesText = `${t1} ${t2}`;

                if (num === 1) {
                    hintBox.innerHTML = `
                        <div class="hint-content-inner">
                            <span class="hint-title">💡 DICA 1 (Geração & Tipos):</span>
                            <p>Geração: <b>Gen ${target.gen}</b> | Tipo(s): <span class="hint-highlight">${typesText}</span> | Estágio: <b>${target.stage}</b></p>
                        </div>
                    `;
                } else if (num === 2) {
                    const first = target.name.charAt(0);
                    const last = target.name.charAt(target.name.length - 1);
                    hintBox.innerHTML = `
                        <div class="hint-content-inner">
                            <span class="hint-title">💡 DICA 2 (Nome do Pokémon):</span>
                            <p>Começa com '<b>${first}</b>' e termina com '<b>${last}</b>' (Possui <b>${target.name.length}</b> letras)</p>
                        </div>
                    `;
                }
            }

            function showToastNotification(msg) {
                let toast = document.getElementById('retroToast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'retroToast';
                    toast.style.cssText = `
                        position: fixed;
                        bottom: 24px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: #991b1b;
                        border: 2px solid #f87171;
                        color: #fff;
                        padding: 8px 16px;
                        border-radius: 6px;
                        font-family: 'Pixelify Sans', monospace;
                        font-size: 1rem;
                        z-index: 100000;
                        box-shadow: 0 4px 15px rgba(0,0,0,0.8);
                        transition: opacity 0.3s;
                    `;
                    document.body.appendChild(toast);
                }
                toast.innerText = msg;
                toast.style.opacity = '1';
                toast.style.display = 'block';

                if (window.toastTimeout) clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => { toast.style.display = 'none'; }, 300);
                }, 2500);
            }

            function clearUnlockedDex() {
                if (confirm('Tem certeza de que deseja reiniciar o progresso da Pokédex?')) {
                    unlockedDexIds.clear();
                    localStorage.removeItem('pokedle_unlocked_dex');
                    updatePool();
                    renderOrderDexBoard();
                    renderModeDisplay();
                }
            }

            function handleSearchInput(e) {
                const query = e.target.value.trim().toLowerCase();
                const list = document.getElementById('autocompleteList');

                if (!query) {
                    list.style.display = 'none';
                    return;
                }

                const currentGuesses = getActiveGuesses();
                const matches = currentPool.filter(p =>
                    p.name.toLowerCase().includes(query) &&
                    (activeMode === 'order' ? !unlockedDexIds.has(p.id) : !currentGuesses.some(g => g.id === p.id))
                ).slice(0, 8);

                if (matches.length === 0) {
                    list.style.display = 'none';
                    return;
                }

                list.innerHTML = matches.map((p, idx) => `
            <div class="autocomplete-item ${idx === 0 ? 'selected' : ''}" onclick="submitGuess(${p.id})">
              <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="${p.name}" />
              <span class="poke-name">${p.name}</span>
              <span class="poke-id">#${String(p.id).padStart(3, '0')} (Gen ${p.gen})</span>
            </div>
          `).join('');

                list.style.display = 'block';
            }

            function handleSearchKeydown(e) {
                const list = document.getElementById('autocompleteList');
                const items = list.querySelectorAll('.autocomplete-item');
                let selectedIndex = Array.from(items).findIndex(el => el.classList.contains('selected'));

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (items.length > 0) {
                        if (selectedIndex >= 0) items[selectedIndex].classList.remove('selected');
                        selectedIndex = (selectedIndex + 1) % items.length;
                        items[selectedIndex].classList.add('selected');
                        items[selectedIndex].scrollIntoView({ block: 'nearest' });
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (items.length > 0) {
                        if (selectedIndex >= 0) items[selectedIndex].classList.remove('selected');
                        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                        items[selectedIndex].classList.add('selected');
                        items[selectedIndex].scrollIntoView({ block: 'nearest' });
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const selected = list.querySelector('.autocomplete-item.selected');
                    if (selected) selected.click();
                }
            }

            function submitGuess(pokeId) {
                const pokemon = ALL_POKEMON.find(p => p.id === pokeId);
                if (!pokemon) return;

                document.getElementById('searchInput').value = '';
                document.getElementById('autocompleteList').style.display = 'none';

                if (activeMode === 'order') {
                    const targetSlotPoke = ALL_POKEMON.find(p => p.id === activeDexSlotId);
                    if (!targetSlotPoke) return;

                    if (pokemon.id === targetSlotPoke.id) {
                        unlockedDexIds.add(pokemon.id);
                        localStorage.setItem('pokedle_unlocked_dex', JSON.stringify(Array.from(unlockedDexIds)));

                        slotErrors[activeDexSlotId] = 0;
                        activeHintRevealed = null;

                        const nextEmpty = currentPool.find(p => !unlockedDexIds.has(p.id));
                        if (nextEmpty) {
                            activeDexSlotId = nextEmpty.id;
                        }

                        if (unlockedDexIds.size >= currentPool.length && typeof confetti === 'function') {
                            confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
                        }

                        updateHintsUI();
                        renderOrderDexBoard();
                        renderModeDisplay();
                    } else {
                        if (!slotErrors[activeDexSlotId]) slotErrors[activeDexSlotId] = 0;
                        slotErrors[activeDexSlotId]++;
                        showToastNotification(`❌ Palpite incorreto para o slot #${String(activeDexSlotId).padStart(3, '0')}!`);
                        updateHintsUI();
                    }
                    return;
                }

                const currentGuesses = getActiveGuesses();
                if (currentGuesses.some(g => g.id === pokemon.id)) return;

                currentGuesses.unshift(pokemon);
                stats.attempts++;

                const target = getActiveTarget();
                if (pokemon.id !== target.id) {
                    modeErrors[activeMode]++;
                    updateHintsUI();
                }

                renderClassicRow(pokemon, target);

                if (activeMode !== 'classic') {
                    renderModeDisplay();
                }

                if (pokemon.id === target.id) {
                    handleWin();
                }
            }

            function renderClassicRow(guess, target) {
                const targetPoke = target || getActiveTarget();
                const container = document.getElementById('guessesContainer');

                const t1Match = guess.type1 === targetPoke.type1 ? 'correct' :
                    (guess.type1 === targetPoke.type2 ? 'partial' : 'wrong');

                const t2Match = guess.type2 === targetPoke.type2 ? 'correct' :
                    (guess.type2 === targetPoke.type1 ? 'partial' : 'wrong');

                const genMatch = guess.gen === targetPoke.gen ? 'correct' : 'wrong';
                const genArrow = guess.gen < targetPoke.gen ? '↑' : (guess.gen > targetPoke.gen ? '↓' : '');

                const hMatch = guess.height === targetPoke.height ? 'correct' : 'wrong';
                const hArrow = guess.height < targetPoke.height ? '↑' : (guess.height > targetPoke.height ? '↓' : '');

                const wMatch = guess.weight === targetPoke.weight ? 'correct' : 'wrong';
                const wArrow = guess.weight < targetPoke.weight ? '↑' : (guess.weight > targetPoke.weight ? '↓' : '');

                const stageMatch = guess.stage === targetPoke.stage ? 'correct' : 'wrong';

                const rowHTML = `
            <div class="guess-row">
              <div class="tile" style="background: #0f172a;">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${guess.id}.png" alt="${guess.name}" />
                <div style="font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">${guess.name}</div>
              </div>

              <div class="tile ${t1Match}">
                <span class="type-badge" style="background: var(--type-${guess.type1.toLowerCase()});">
                  ${TYPE_TRANSLATIONS[guess.type1]}
                </span>
              </div>

              <div class="tile ${t2Match}">
                <span class="type-badge" style="background: var(--type-${guess.type2.toLowerCase()});">
                  ${TYPE_TRANSLATIONS[guess.type2]}
                </span>
              </div>

              <div class="tile ${genMatch}">
                Gen ${guess.gen}
                ${genArrow ? `<span class="arrow">${genArrow}</span>` : ''}
              </div>

              <div class="tile ${hMatch}">
                ${guess.height} m
                ${hArrow ? `<span class="arrow">${hArrow}</span>` : ''}
              </div>

              <div class="tile ${wMatch}">
                ${guess.weight} kg
                ${wArrow ? `<span class="arrow">${wArrow}</span>` : ''}
              </div>

              <div class="tile ${stageMatch}">
                <span style="font-size: 0.75rem;">${guess.stage}</span>
              </div>
            </div>
          `;

                container.insertAdjacentHTML('afterbegin', rowHTML);
            }

            function handleWin() {
                stats.wins++;
                stats.streak++;
                localStorage.setItem('pokedle_wins', stats.wins);
                localStorage.setItem('pokedle_streak', stats.streak);

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
                }

                const target = getActiveTarget();
                document.getElementById('modalImg').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${target.id}.png`;
                document.getElementById('modalName').innerText = target.name;
                document.getElementById('statAttempts').innerText = stats.attempts;
                document.getElementById('statStreak').innerText = stats.streak;
                document.getElementById('statWins').innerText = stats.wins;

                setTimeout(() => {
                    document.getElementById('winModal').classList.add('active');
                }, 500);
            }

            function closeModalAndNext() {
                document.getElementById('winModal').classList.remove('active');
                if (activeMode === 'order') {
                    renderOrderDexBoard();
                    renderModeDisplay();
                } else {
                    resetGame(activeMode);
                }
            }

            // EXPOSIÇÃO CONTROLADA APENAS DAS FUNÇÕES DE INTERFACE NECESSÁRIAS
            window.switchMode = switchMode;
            window.triggerHint = triggerHint;
            window.toggleGen = toggleGen;
            window.selectGens = selectGens;
            window.resetGame = resetGame;
            window.clearUnlockedDex = clearUnlockedDex;
            window.submitGuess = submitGuess;
            window.playCry = playCry;
            window.closeModalAndNext = closeModalAndNext;
        })();
    </script>
</body>

</html>
